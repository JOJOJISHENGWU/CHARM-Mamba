dataset:
  name: pems_bay
  num_nodes: 325
  in_steps: 12
  out_steps: 12
  interval_min: 5
  features: 1
  split:
    target_few_shot_days: 3
    train_ratio: 0.7
    val_ratio: 0.2
    test_ratio: 0.1
transfer:
  setting: multi_source_to_single_target
  source_domains: [metr_la, chengdu, shenzhen]
  source_domain_count: 3
  target_domain: pems_bay
  note: "Official release follows the paper and uses METR-LA, Chengdu, and Shenzhen as sources."
model:
  d_model: 128
  d_state: 16
  n_layers: 3
  adapter_rank: 32
  num_prototypes: 10
  routing_temperature: 0.5
  uncertainty_delta: 0.3
train:
  seed: 42
  batch_size: 16
  learning_rate: 1e-4
  weight_decay: 1e-5
  epochs: 100
  early_stop_patience: 15
eval:
  horizons_min: [5, 15, 30]
  metrics: [mae, rmse, mape]
