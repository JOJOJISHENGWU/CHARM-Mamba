dataset:
  name: chengdu
  num_nodes: 524
  in_steps: 12
  out_steps: 12
  interval_min: 10
  features: 1
  split:
    train_ratio: 0.7
    val_ratio: 0.2
    test_ratio: 0.1
transfer:
  setting: multi_source_to_single_target
  role: source_domain
  enabled: true
  for_target: pems_bay
  source_group: [metr_la, chengdu, shenzhen]
model:
  d_model: 128
  d_state: 16
  n_layers: 3
  adapter_rank: 32
  num_prototypes: 10
  routing_temperature: 0.5
  uncertainty_delta: 0.3
train:
  seed: 42
  batch_size: 16
  learning_rate: 1e-4
  weight_decay: 1e-5
  epochs: 100
  early_stop_patience: 15
eval:
  horizons_min: [10, 30, 60]
  metrics: [mae, rmse, mape]
